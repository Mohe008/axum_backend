[workspace]
members =[".", "migration"]

[[bin]]
name = "seed"
path = "src/bin/seed.rs"

[package]
name = "check"
version = "0.1.0"
edition = "2024"
default-run = "check"

[dependencies]
argon2 = "0.6.0"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["typed-header"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
rust_decimal = { version = "1.43.0", features = ["serde-float"] }
sea-orm = { version = "2.0.4", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-json"
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
validator = { version = "0.21.0", features = ["derive"] }
watch = "0.2.3"

[dev-dependencies]
axum-test = { version = "21.1.0", features = ["all"] }
tokio-test = "0.4.6"
